[unix_http_server]
file=/run/piccolo-ai/supervisor.sock
chmod=0770
chown=developer:developer

[supervisord]
nodaemon=true
user=root
logfile=/var/lib/piccolo-ai/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=2
pidfile=/run/piccolo-ai/supervisord.pid
childlogdir=/var/lib/piccolo-ai/logs

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/piccolo-ai/supervisor.sock

[program:sshd]
command=/usr/sbin/sshd -D -e -f /etc/piccolo-ai/sshd_config
priority=10
autostart=true
autorestart=unexpected
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -c /etc/piccolo-ai/nginx.conf -g "daemon off;"
priority=20
autostart=true
autorestart=unexpected
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:gemma]
command=/usr/local/bin/gemma-run
directory=/home/developer
user=developer
priority=30
autostart=false
autorestart=false
startsecs=10
startretries=0
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/lib/piccolo-ai/logs/gemma.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
