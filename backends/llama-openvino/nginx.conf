user developer;
worker_processes 1;
pid /run/piccolo-ai/nginx.pid;
error_log stderr info;

events {
    worker_connections 256;
}

http {
    access_log /dev/stdout;
    server_tokens off;
    client_max_body_size 64m;
    client_body_temp_path /run/nginx/client_body;
    proxy_temp_path /run/nginx/proxy;
    fastcgi_temp_path /run/nginx/fastcgi;
    scgi_temp_path /run/nginx/scgi;
    uwsgi_temp_path /run/nginx/uwsgi;

    upstream llama_backend {
        server 127.0.0.1:8080;
        keepalive 8;
    }

    server {
        listen 8000;

        location = /healthz {
            default_type application/json;
            return 200 '{"status":"healthy","mode":"bring-up"}';
        }

        location = /readyz {
            proxy_pass http://llama_backend/health;
            proxy_intercept_errors on;
            error_page 502 503 504 = @not_ready;
        }

        location = / {
            default_type application/json;
            return 200 '{"name":"Piccolo AI Gemma 4 OpenVINO","mode":"bring-up","hint":"Connect over Piccolo SSH tunnel and run gemma status"}';
        }

        location = /v1 {
            proxy_pass http://llama_backend/v1;
            include /etc/piccolo-ai/proxy_params;
        }

        location /v1/ {
            proxy_pass http://llama_backend;
            include /etc/piccolo-ai/proxy_params;
        }

        location @not_ready {
            default_type application/json;
            return 503 '{"status":"not_ready","hint":"Run gemma status over SSH"}';
        }

        location @backend_unavailable {
            default_type application/json;
            return 503 '{"error":{"message":"Inference backend unavailable","type":"server_error","code":"backend_unavailable"}}';
        }
    }

    server {
        listen 8001;

        location = /v1 {
            proxy_pass http://llama_backend/v1;
            include /etc/piccolo-ai/proxy_params;
        }

        location /v1/ {
            proxy_pass http://llama_backend;
            include /etc/piccolo-ai/proxy_params;
        }

        location / {
            default_type application/json;
            return 404 '{"error":{"message":"Use the /v1 capability base path","type":"invalid_request_error","code":"not_found"}}';
        }

        location @backend_unavailable {
            default_type application/json;
            return 503 '{"error":{"message":"Inference backend unavailable","type":"server_error","code":"backend_unavailable"}}';
        }
    }
}
